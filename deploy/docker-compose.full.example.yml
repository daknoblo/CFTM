# CFTM — Cloudflare Tunnel Monitor
#
# Every available setting, each shown with its default. Only the two Cloudflare
# credentials are required; delete any line you are happy with.
#
# For a working starting point use docker-compose.example.yml instead.

services:
  cftm:
    image: ghcr.io/daknoblo/cftm:latest
    container_name: cftm
    restart: unless-stopped
    # Bind to loopback so the dashboard is only reachable through the tunnel.
    # Without the prefix Docker publishes on 0.0.0.0 and writes its own DNAT
    # rules past the host firewall. Change the left-hand port if 8080 is taken.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # --- Required ----------------------------------------------------------
      # A dedicated read-only token, see docs/cloudflare-token.md.
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}

      # --- Server ------------------------------------------------------------
      # debug, info, warn, error
      - CFTM_LOG_LEVEL=info
      - TZ=Europe/Berlin

      # --- Collection --------------------------------------------------------
      # The Cloudflare quota is 1200 requests per five minutes and is shared
      # with the dashboard and every other token of the same user. 30s uses
      # about 3.7% of it. The minimum accepted value is 10s.
      - CFTM_POLL_INTERVAL=30s
      # Ingress rules are re-fetched every N cycles, and immediately whenever a
      # connector reports a different configuration version.
      - CFTM_CONFIG_REFRESH_EVERY=10
      # Age at which history, probe results, events and poll runs are pruned.
      - CFTM_RETENTION_DAYS=90

      # --- Access audit ------------------------------------------------------
      - CFTM_ACCESS_AUDIT_ENABLED=true
      - CFTM_ACCESS_AUDIT_INTERVAL=1h
      # Hostnames published without an Access application on purpose, because
      # their clients cannot complete a browser login. They are still monitored
      # and probed, they just stop counting as a coverage gap.
      - CFTM_EXPECTED_PUBLIC=public-app.example.com,feed.example.com

      # --- cloudflared version drift -----------------------------------------
      - CFTM_RELEASE_CHECK_ENABLED=true
      - CFTM_RELEASE_CHECK_INTERVAL=12h

      # --- End-to-end probing ------------------------------------------------
      # Off by default. Without the Access service token, guarded hostnames only
      # report access_challenge: that proves the Cloudflare edge is reachable
      # but says nothing about the origin.
      - CFTM_PROBE_ENABLED=false
      - CFTM_PROBE_INTERVAL=5m
      - CFTM_PROBE_TIMEOUT=10s
      - CFTM_PROBE_CONCURRENCY=4
      - CFTM_ACCESS_CLIENT_ID=${CFTM_ACCESS_CLIENT_ID}
      - CFTM_ACCESS_CLIENT_SECRET=${CFTM_ACCESS_CLIENT_SECRET}
    volumes:
      - cftm-data:/appdata
    # Runtime hardening; the image cannot set any of this for you. The binary
    # writes only to /appdata, so nothing else has to be writable.
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL

volumes:
  cftm-data:
