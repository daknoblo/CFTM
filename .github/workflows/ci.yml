# Runs on every push and pull request to validate code quality before merge:
# checks generated assets, lints, runs tests and compiles the project.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEMPL_VERSION: v0.3.1020
  TAILWIND_VERSION: v3.4.17
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ code generator
        run: go install github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}

      - name: Check generated templ code is committed
        run: |
          templ generate
          git diff --exit-code -- '*_templ.go' \
            || (echo "::error::Generated templ code is stale. Run 'make generate' and commit the result." && exit 1)

      - name: Check compiled Tailwind CSS is committed
        run: |
          curl -fsSL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64" -o tailwindcss
          chmod +x tailwindcss
          ./tailwindcss -c tailwind.config.js -i internal/web/assets/input.css -o internal/web/assets/static/app.css --minify
          git diff --exit-code -- internal/web/assets/static/app.css \
            || (echo "::error::Compiled app.css is stale. Run 'make css' and commit the result." && exit 1)
          rm -f tailwindcss

      - name: gofmt (check formatting)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build (static, CGO-free)
        run: CGO_ENABLED=0 go build ./...
