# Renders the demo site from fabricated data, publishes it to GitHub Pages and
# refreshes the README screenshots from the same build.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "cmd/**"
      - "scripts/screenshots.mjs"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build demo site
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the regenerated screenshots
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The site is served from https://<user>.github.io/CFTM, so every
      # root-absolute link has to carry that prefix.
      - name: Export static site
        run: go run ./cmd/cftm-demo -out ./site -base /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Serve the demo for screenshots
        run: |
          go run ./cmd/cftm-demo -addr 127.0.0.1:8099 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/healthz >/dev/null && break
            sleep 1
          done

      - name: Capture screenshots
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/screenshots.mjs http://127.0.0.1:8099 docs/screenshots

      # The README embeds these, so they have to travel with the code that
      # produced them rather than being an artifact nobody looks at.
      - name: Commit refreshed screenshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && echo "screenshots unchanged" && exit 0
          git commit -m "Refresh demo screenshots [skip ci]"
          git push

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
